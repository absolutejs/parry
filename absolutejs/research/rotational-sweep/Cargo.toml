[workspace]
[package]
name = "absolutejs-certified-normal-qualification"
version = "0.0.0"
edition = "2021"
publish = false
[dependencies]
parry3d = { path = "../../../crates/parry3d", default-features = false, features = ["required-features", "std", "alloc", "serde-serialize"] }
glamx = { version = "0.3", default-features = false, features = ["nostd-libm", "f64"] }
serde_json = "1"
bincode = "1.3.3"
[[bin]]
name = "rotational-sweep-probe"
path = "probe.rs"

[[bin]]
name = "rotational-sweep-matrix"
path = "matrix.rs"

[features]
default = ["dim3"]
dim3 = []
dim2 = []
[[test]]
name = "existing-sweep-controls"
path = "controls.rs"

[[bin]]
name = "rotational-sweep-cost"
path = "cost.rs"

[[test]]
name = "oak-contact-normal"
path = "oak-contact.rs"
