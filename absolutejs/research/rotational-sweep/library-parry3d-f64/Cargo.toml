[workspace]

[package]
"name"="parry3d-f64"
"version"="0.31.1"
"edition"="2021"
"publish"=false
[lib]
"name"="parry3d_f64"
"path"="../../../../src/lib.rs"
[features]
"default"=[]
"required-features"=["dim3","f64"]
"std"=["glamx/std","slab","simba/std","arrayvec/std","thiserror/std","ena"]
"dim3"=[]
"f64"=[]
"serde-serialize"=["serde","serde_arrays","glamx/serde","bitflags/serde","hashbrown?/serde"]
"rkyv"=[]
"bytemuck-serialize"=[]
"simd8"=[]
"enhanced-determinism"=[]
"parallel"=[]
"wavefront"=[]
"alloc"=["hashbrown"]
"spade"=[]
"improved_fixed_point_support"=[]
"dim2"=[]
"f32"=[]
[dependencies]
"either"={"version"="1","default-features"=false}
"bitflags"={"version"="2.3"}
"downcast-rs"={"version"="2","default-features"=false,"features"=["sync"]}
"num-traits"={"version"="0.2","default-features"=false}
"slab"={"version"="0.4","optional"=true}
"arrayvec"={"version"="0.7","default-features"=false}
"simba"={"version"="0.10.1","default-features"=false,"features"=["wide"]}
"glamx"={"version"="0.3","default-features"=false,"features"=["nostd-libm","approx","f64","i64"]}
"approx"={"version"="0.5","default-features"=false}
"serde"={"version"="1.0","features"=["derive","rc"],"optional"=true}
"serde_arrays"={"version"="0.2","optional"=true}
"num-derive"={"version"="0.5"}
"hashbrown"={"version"="0.17","default-features"=false,"features"=["default-hasher"],"optional"=true}
"foldhash"={"version"="0.2","default-features"=false}
"rstar"={"version"="0.13.0"}
"ena"={"version"="0.14.3","default-features"=false,"optional"=true}
"smallvec"={"version"="1"}
"log"={"version"="0.4"}
"ordered-float"={"version"="5","default-features"=false}
"thiserror"={"version"="2","default-features"=false}
[dev-dependencies]
"oorandom"="11"
