[workspace]

[package]
"name"="parry2d"
"version"="0.31.1"
"edition"="2021"
"publish"=false
[lib]
"name"="parry2d"
"path"="../../../../src/lib.rs"
[features]
"default"=[]
"required-features"=["dim2","f32"]
"std"=["alloc","glamx/std","slab","simba/std","arrayvec/std","thiserror/std","ena"]
"dim2"=[]
"f32"=[]
"serde-serialize"=["serde","serde_arrays","glamx/serde","arrayvec/serde","bitflags/serde","hashbrown?/serde"]
"rkyv"=[]
"bytemuck-serialize"=[]
"simd8"=[]
"enhanced-determinism"=[]
"parallel"=[]
"alloc"=["hashbrown","smallvec","downcast-rs","glamx/approx"]
"spade"=[]
"improved_fixed_point_support"=[]
"encase"=[]
"dim3"=[]
"f64"=[]
[dependencies]
"either"={"version"="1","default-features"=false}
"bitflags"={"version"="2.3"}
"downcast-rs"={"version"="2","default-features"=false,"features"=["sync"],"optional"=true}
"num-traits"={"version"="0.2","default-features"=false}
"slab"={"version"="0.4","optional"=true}
"arrayvec"={"version"="0.7","default-features"=false}
"simba"={"version"="0.10.1","default-features"=false,"features"=["wide"]}
"glamx"={"version"="0.3","default-features"=false,"features"=["nostd-libm","i32"]}
"approx"={"version"="0.5","default-features"=false}
"serde"={"version"="1.0","features"=["derive"],"optional"=true}
"serde_arrays"={"version"="0.2","optional"=true}
"num-derive"={"version"="0.5"}
"hashbrown"={"version"="0.17","default-features"=false,"features"=["default-hasher"],"optional"=true}
"ordered-float"={"version"="5","default-features"=false}
"log"={"version"="0.4"}
"thiserror"={"version"="2","default-features"=false}
"ena"={"version"="0.14.3","default-features"=false,"optional"=true}
"smallvec"={"version"="1","optional"=true}
"foldhash"={"version"="0.2","default-features"=false}
[dev-dependencies]
"oorandom"="11"
